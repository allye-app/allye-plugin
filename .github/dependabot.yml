version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  # semantic-release toolchain, locked in release/package-lock.json.
  - package-ecosystem: npm
    directory: /release
    schedule:
      interval: weekly
  # bun.lock is not supported by Dependabot; this only tracks package.json ranges.
  - package-ecosystem: npm
    directory: /packages/allye-opencode
    schedule:
      interval: weekly

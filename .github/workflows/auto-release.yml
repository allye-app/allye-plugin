name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    permissions:
      contents: write # semantic-release pushes the release commit and tag and creates the GitHub release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install semantic-release
        run: npm ci --ignore-scripts --include=dev --prefix release

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./release/node_modules/.bin/semantic-release

      - name: Record the released commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-opencode:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build allye-opencode
        working-directory: packages/allye-opencode
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Stage the package files
        run: |
          set -euo pipefail
          mkdir -p out/allye-opencode
          cd packages/allye-opencode
          cp -R dist skills README.md LICENSE package.json ../../out/allye-opencode/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allye-opencode-package
          path: out/allye-opencode
          retention-days: 1
          if-no-files-found: error

  publish-opencode:
    needs: [build-opencode, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing (>= 11.5.1)
        run: npm install -g npm@11.19.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: allye-opencode-package
          path: allye-opencode-package

      - name: Check if version changed
        id: version
        working-directory: allye-opencode-package
        run: |
          LOCAL=$(jq -r '.version' package.json)
          REMOTE=$(npm view allye-opencode version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the package identity
        working-directory: allye-opencode-package
        run: |
          set -euo pipefail
          test "$(jq -r '.name' package.json)" = "allye-opencode"
          jq -r '.repository.url' package.json | grep -Fq 'allye-app/allye-plugin'

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        working-directory: allye-opencode-package
        run: npm publish --access public --ignore-scripts

  publish-pi:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing (>= 11.5.1)
        run: npm install -g npm@11.19.0

      - name: Validate allye-pi package
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' package.json)
          test "$(jq -r '.name' package.json)" = "allye-pi"
          test "$(jq -r '.private // false' package.json)" = "false"
          test "$(jq -r '.version' package-lock.json)" = "$VERSION"
          test "$(jq -r '.packages[""].name' package-lock.json)" = "allye-pi"
          test "$(jq -r '.packages[""].version' package-lock.json)" = "$VERSION"
          jq -e '.pi.extensions == ["./packages/allye-pi/src/index.ts"] and .pi.skills == ["./skills"] and (.dependencies["pi-mcp-adapter"] | type == "string")' package.json >/dev/null
          test -f packages/allye-pi/src/index.ts
          test -d skills
          npm pack --dry-run >/dev/null

      - name: Check if version changed
        id: version
        run: |
          set -euo pipefail
          LOCAL=$(jq -r '.version' package.json)
          REMOTE=$(npm view allye-pi version --registry=https://registry.npmjs.org 2>/dev/null || true)
          REMOTE=${REMOTE:-0.0.0}
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish allye-pi to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish --access public --ignore-scripts

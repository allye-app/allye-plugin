name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/git @semantic-release/exec @semantic-release/changelog

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  publish-opencode:
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      - name: Build allye-opencode
        working-directory: packages/allye-opencode
        run: |
          bun install
          bun run build

      - name: Check if version changed
        id: version
        working-directory: packages/allye-opencode
        run: |
          LOCAL=$(jq -r '.version' package.json)
          REMOTE=$(npm view allye-opencode version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        working-directory: packages/allye-opencode
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pi:
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate allye-pi package
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' package.json)
          test "$(jq -r '.name' package.json)" = "allye-pi"
          test "$(jq -r '.private // false' package.json)" = "false"
          test "$(jq -r '.version' package-lock.json)" = "$VERSION"
          test "$(jq -r '.packages[""].name' package-lock.json)" = "allye-pi"
          test "$(jq -r '.packages[""].version' package-lock.json)" = "$VERSION"
          jq -e '.pi.extensions == ["./packages/allye-pi/src/index.ts"] and .pi.skills == ["./skills"] and (.dependencies["pi-mcp-adapter"] | type == "string")' package.json >/dev/null
          test -f packages/allye-pi/src/index.ts
          test -d skills
          npm pack --dry-run >/dev/null

      - name: Check if version changed
        id: version
        run: |
          set -euo pipefail
          LOCAL=$(jq -r '.version' package.json)
          REMOTE=$(npm view allye-pi version --registry=https://registry.npmjs.org 2>/dev/null || true)
          REMOTE=${REMOTE:-0.0.0}
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish allye-pi to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
